
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewaste-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ewaste-backend
  template:
    metadata:
      labels:
        app: ewaste-backend
    spec:
      containers:
        - name: backend
          image: sanesh7644/ewaste-backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: ewaste-backend-env
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
